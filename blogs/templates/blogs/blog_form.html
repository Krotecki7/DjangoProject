{% extends 'blogs/base.html' %}
{% block content %}
    <div class="container mt-5">
        <h1 class="mb-4">Создать блог</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <a href="{% url 'blogs:blog_detail' %}" class="btn btn-primary">Сохранить</a>
            <a href="{% url 'blogs:blog_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
